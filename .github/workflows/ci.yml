name: CI

on:
  push:
  pull_request:

# One run per branch: a push and its pull request share a group, so they do not run twice.
# Runs on main are never cancelled, so a deploy-relevant result is always completed.
concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Tests never call real AI providers (see block_external_ai_calls in conftest.py),
      # so every key below is a placeholder.
      POSTGRES_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/postgres
      POSTGRES_URL_TEST: postgresql+asyncpg://postgres:postgres@localhost:5432/study_assistant_test
      API_KEYS_GEMINI: ci-placeholder
      CLOUDFLARE_ACCOUNT_ID: ci-placeholder
      CLOUDFLARE_API_TOKEN: ci-placeholder
      PRIVATE_KEY: ci-placeholder-not-a-secret
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.lock

      - name: Lock files match requirements*.txt
        run: |
          pip install uv==0.13.7
          sh scripts/compile-locks.sh
          git diff --exit-code -- requirements.lock requirements-dev.lock \
            || { echo "::error::Lock files are stale. Run: sh scripts/compile-locks.sh"; exit 1; }

      - name: Install dependencies
        run: |
          pip install -r requirements.lock -r requirements-dev.lock
          pip install ruff==0.17.4

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Create the test database
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE study_assistant_test;"

      - name: Use the example settings for everything not set above
        run: cp backend/.env.example backend/.env

      # The floor sits just under the current figure (72%): it stops coverage from
      # sliding back without forcing tests to be written only to move a number.
      - name: Tests (pytest) with coverage
        run: python -m pytest backend/tests -q --cov=backend/src --cov-report=term --cov-fail-under=70

      - name: Coverage table in the run summary
        if: always()
        run: |
          echo "## Backend test coverage" >> "$GITHUB_STEP_SUMMARY"
          python -m coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY" || true

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm run lint

      - run: npm run build

  # The job name is a required status check on main: do not rename it.
  docker:
    name: Docker image (build)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build the backend image (not pushed)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: dolphin-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The test job installs dev tools next to the runtime dependencies, so it
      # cannot notice a package that only the dev tools pull in. Starting the
      # real image is what catches a missing runtime dependency.
      - name: Start the runtime image and wait for /health
        run: |
          docker run -d --name api --network host \
            -e DEV_MODE=false \
            -e POSTGRES_URL=postgresql+asyncpg://postgres:postgres@localhost:5432/postgres \
            -e PRIVATE_KEY=ci-placeholder-not-a-secret \
            -e API_KEYS_GEMINI=ci-placeholder \
            -e CLOUDFLARE_ACCOUNT_ID=ci-placeholder \
            -e CLOUDFLARE_API_TOKEN=ci-placeholder \
            dolphin-api:ci
          for i in $(seq 1 30); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/health)" = "200" ]; then
              echo "healthy after ${i} attempt(s)"
              exit 0
            fi
            sleep 2
          done
          echo "::error::The runtime image did not become healthy"
          docker logs api
          exit 1

      - name: The image runs as an unprivileged user
        run: test "$(docker exec api id -u)" != "0"
