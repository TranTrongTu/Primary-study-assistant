name: Security audit

# Checks the pinned dependencies against the public vulnerability databases.
# A new advisory can appear without any change in this repository, so besides
# running when a dependency file changes, this also runs every Monday.
# It is not a required status check: an advisory published overnight must not
# block an unrelated merge, but it does show up as a failed run.
on:
  pull_request:
    paths:
      - requirements*.lock
      - frontend/package-lock.json
      - .github/workflows/security.yml
  push:
    branches: [main]
    paths:
      - requirements*.lock
      - frontend/package-lock.json
      - .github/workflows/security.yml
  schedule:
    - cron: "0 1 * * 1" # Mondays 08:00 Vietnam time
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  python:
    name: Python dependencies (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - run: pip install pip-audit==2.10.1

      # The lock files are fully pinned, so they are audited as written
      # (--no-deps --disable-pip) instead of being resolved again.
      - name: Audit the runtime dependencies
        run: pip-audit -r requirements.lock --no-deps --disable-pip

      - name: Audit the development dependencies
        run: pip-audit -r requirements-dev.lock --no-deps --disable-pip

  frontend:
    name: Frontend dependencies (npm audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Fails on high and critical advisories. The remaining moderate ones need
      # a major upgrade (react-router 7, katex 0.19) and do not fail this job.
      - run: npm audit --audit-level=high
