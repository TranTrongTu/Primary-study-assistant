services:
  # Database service
  db:
    image: pgvector/pgvector:pg16
    # Credentials come from the root .env file (copy .env.example -> .env)
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    ports:
      # Bound to localhost only: the database is not reachable from other machines
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Creates the separate <POSTGRES_DB>_test database on first start
      - ./docker/postgres/init-test-db.sh:/docker-entrypoint-initdb.d/init-test-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 10

  # Backend Service
  api:
    build:
      context: .
      target: dev # debugpy + test tools; Render/CI build the default `runtime` target
    ports:
      - "8000:8000"
      - "127.0.0.1:5678:5678" # debugpy, localhost only
    env_file:
      - ./backend/.env
    environment:
      # Inside Docker the database host is the "db" service, not localhost
      POSTGRES_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # Separate database for pytest (tests drop all tables)
      POSTGRES_URL_TEST: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}_test
      # OLLAMA_HOST: http://ollama:11434
    depends_on:
      db:
        condition: service_healthy
      # ollama:
      #   condition: service_started
      # ollama-init:
      #   condition: service_completed_successfully
    volumes:
      - ./backend:/code/backend
    command:
      [
        "python",
        "-m",
        "debugpy",
        "--listen",
        "0.0.0.0:5678",
        "-m",
        "fastapi",
        "run",
        "backend/src/main.py",
        "--port",
        "8000",
        "--host",
        "0.0.0.0",
      ]

